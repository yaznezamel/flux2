apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: shop-debug
    literals:
      - LOG_LEVEL=debug
      - PPROF_ENABLED=true

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: shop
      spec:
        template:
          spec:
            containers:
              - name: shop
                envFrom:
                  - configMapRef:
                      name: shop-debug
