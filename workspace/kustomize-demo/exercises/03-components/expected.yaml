apiVersion: v1
data:
  LOG_LEVEL: debug
  PPROF_ENABLED: "true"
kind: ConfigMap
metadata:
  name: shop-debug-5h8254kb8g
  namespace: staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      annotations:
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: shop
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: shop-debug-5h8254kb8g
        image: ghcr.io/example/shop:2.4.0
        name: shop
        ports:
        - containerPort: 8080
          name: http
