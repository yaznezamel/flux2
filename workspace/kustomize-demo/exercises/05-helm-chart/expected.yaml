apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - env:
        - name: MESSAGE
          value: hello from kustomize
        image: nginx:1.27
        name: hello
        resources:
          limits:
            memory: 128Mi
