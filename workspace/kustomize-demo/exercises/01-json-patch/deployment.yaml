apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    team.example.com/owner: platform
    debug.example.com/enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/api:1.0.0
          args:
            - --port=8080
        - name: debug-shell
          image: busybox:1.36
          command: ["sleep", "infinity"]
