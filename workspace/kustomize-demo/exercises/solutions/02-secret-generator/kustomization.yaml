apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml

secretGenerator:
  - name: db-credentials
    literals:
      - username=api
    files:
      - password=password.txt
  - name: api-tls
    type: Opaque
    files:
      - tls.crt
    options:
      disableNameSuffixHash: true
