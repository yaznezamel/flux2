apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --log-format=json
      - op: remove
        path: /spec/template/spec/containers/1
      - op: remove
        path: /metadata/annotations/debug.example.com~1enabled
